[project]
name = "kestrel-fast-track"
version = "0.1.0"
description = "Cited SME underwriting workbench with mandatory human decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "langgraph>=1,<2",
  "google-genai>=1.30,<2", "groq>=0.31,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20", "pymupdf>=1.25,<2",
  "google-cloud-secret-manager>=2.23,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "google-cloud-storage>=3,<4", "google-cloud-tasks>=2.19,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
